[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluetti-modbus"
version = "0.0.0"
description = "Unofficial library for basic communication to Bluetti Power Stations via Modbus"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Patrick762" }, { name = "bluetti-community" }]
keywords = ["modbus", "bluetti", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
# Protocol + the device-modelling framework (modbus_connection.model). The
# caller injects a ModbusUnit built from whichever backend they choose - see
# README.md. This package does not create or own a Modbus transport itself.
# probatio validates writable fields' bounds (num_min/num_max from
# bluetti-registers' schema) - see import.py's Range()-based writable=.
#
# !=4.11.0: that release's GitHub tag points at a stale side branch
# (poll-example-resends-timeouts), 8 commits behind main at the time -
# confirmed on PyPI itself: 4.11.0's own tmodbus extra requires only
# tmodbus>=0.5.1, where 4.10.0 (and every commit since) requires >=0.6.1.
# Nothing we call is among what's missing (ModbusUnit.disconnect(),
# get_comm_event_counter()'s ready flag, FC08/FC0B/FC0C), but a release
# that's confirmed to ship regressed metadata isn't one to resolve to by
# default. Safe to drop this exclusion once upstream re-tags or yanks it.
dependencies = ["modbus-connection>=4.10.0,!=4.11.0", "probatio>=0.11.4"]

[project.optional-dependencies]
# Concrete backend for the bluetti-modread CLI (pip install bluetti-modbus[cli]).
# tmodbus is the default since 0.4.0 - confirmed via persistent-connection
# testing against real Balco260/S Meter hardware: it correctly reports a
# corrupted/truncated reply as ModbusProtocolError, where pymodbus reports
# the identical event as a generic timeout (see #29 and CONTRIBUTING.md).
# tmodbus pinned explicitly (not just via modbus-connection[tmodbus]'s own
# extra) so this stays correct even against the broken 4.11.0 release above,
# whose own extra under-declares tmodbus>=0.5.1 instead of >=0.6.1.
cli = ["modbus-connection[tmodbus]>=4.10.0,!=4.11.0", "tmodbus[async-serial]>=0.6.1"]
# The previous default backend, still available for anyone who needs it.
cli-pymodbus = ["modbus-connection[pymodbus]>=4.10.0,!=4.11.0"]

[project.urls]
Homepage = "https://github.com/bluetti-community/bluetti-modbus"

[project.scripts]
bluetti-modread = "bluetti_modbus_lib.scripts.bluetti_modread:start"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bluetti_modbus_lib = ["py.typed"]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.mypy]
strict = true
packages = ["bluetti_modbus_lib"]

[tool.coverage.run]
omit = [
    # The bluetti-modread CLI - README.md: "Commands included in this
    # library should only be used for testing." Not library logic.
    "src/bluetti_modbus_lib/scripts/*",
]
