[tool.ruff]
target-version = "py313"
exclude = [
    # Generated by import.py at release time from bluetti-registers' data -
    # linting/reformatting them here would just be undone at the next
    # regeneration. Fix the generator's template instead if these need to
    # change.
    "bluetti_modbus_lib/devices/balco260.py",
    "bluetti_modbus_lib/devices/ep2000.py",
]

[tool.coverage.run]
omit = [
    # The bluetti-modread CLI - README.md: "Commands included in this
    # library should only be used for testing." Not library logic.
    "bluetti_modbus_lib/scripts/*",
]
