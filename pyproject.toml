[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluetti-modbus"
version = "0.0.0"
description = "Unofficial library for basic communication to BLUETTI Power Stations via Modbus"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Patrick762" }, { name = "bluetti-community" }]
keywords = ["modbus", "bluetti", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
# Protocol + the device-modelling framework (modbus_connection.model). The
# caller injects a ModbusUnit built from whichever backend they choose - see
# README.md. This package does not create or own a Modbus transport itself.
# probatio validates writable fields' bounds (num_min/num_max from
# bluetti-registers' schema) - see import.py's Range()-based writable=.
#
# >=4.11.1: BluettiDevice.async_update_with_retry() drops the link after a
# run of identical transient failures (see its docstring), and before
# 4.11.1 ModbusUnit.disconnect()/close() tore the client down with no
# regard for a request still on the wire - so that recovery could cut the
# very reply it was waiting on. 4.11.1 holds the pacer's lock over the
# teardown (bounded at half a second) so an answer about to land is
# delivered and only a wedged request is cut. It also serializes requests
# even with message spacing disabled. 4.11.0 itself was tagged from a stale
# side branch (its tmodbus extra under-declared tmodbus>=0.5.1) and is now
# yanked on PyPI, so the floor being above it is all the exclusion needed.
dependencies = ["modbus-connection>=4.11.1", "probatio>=0.11.4"]

[project.optional-dependencies]
# Concrete backend for the bluetti-modread CLI (pip install bluetti-modbus[cli]).
# tmodbus is the default since 0.4.0 - confirmed via persistent-connection
# testing against real Balco260/S Meter hardware: it correctly reports a
# corrupted/truncated reply as ModbusProtocolError, where pymodbus reports
# the identical event as a generic timeout (see #29 and CONTRIBUTING.md).
# tmodbus pinned explicitly (not just via modbus-connection[tmodbus]'s own
# extra): 4.10.0's fix for FC08 framing needs tmodbus>=0.6.1, and stating
# it here keeps that true whatever an upstream extra happens to declare.
cli = ["modbus-connection[tmodbus]>=4.11.1", "tmodbus[async-serial]>=0.6.1"]
# The previous default backend, still available for anyone who needs it.
cli-pymodbus = ["modbus-connection[pymodbus]>=4.11.1"]

[project.urls]
Homepage = "https://github.com/bluetti-community/bluetti-modbus"

[project.scripts]
bluetti-modread = "bluetti_modbus_lib.scripts.bluetti_modread:start"
bluetti-modwrite = "bluetti_modbus_lib.scripts.bluetti_modwrite:start"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bluetti_modbus_lib = ["py.typed"]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.mypy]
strict = true
packages = ["bluetti_modbus_lib"]

[tool.coverage.run]
omit = [
    # The bluetti-modread CLI - README.md: "Commands included in this
    # library should only be used for testing." Not library logic.
    "src/bluetti_modbus_lib/scripts/*",
]
